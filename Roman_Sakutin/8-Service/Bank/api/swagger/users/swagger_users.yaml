openapi: 3.0.0
info:
  title: Bank-API-Users
  description: Создание domain users
  version: 1.0.0
paths:
  /users:
    get:
      operationId: getUsers
      tags:
        - Получить пользователей
      summary: Получение списка пользователей
      parameters:
        - $ref: '#/components/parameters/UserName'
        - $ref: '#/components/parameters/UserPhoneNumber'
        - $ref: '#/components/parameters/UserMail'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Успешный ответ со списком пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUsersResponse'
        '400':
          $ref: '#/components/responses/MessageResponse'
        '500':
          $ref: '#/components/responses/MessageResponse'
    post:
      operationId: createUser
      tags:
        - Создание пользователя
      summary: Создание пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '201':
          description: Пользователь успешно создан
          content:
            application/json:
              schema:
                type: integer
                format: int64
                example: 1
        '400':
          $ref: '#/components/responses/MessageResponse'
        '500':
          $ref: '#/components/responses/MessageResponse'
  /users/user/{id}:
    get:
      operationId: getUserByID
      tags:
        - Получение пользователя по айди
      summary: Получение пользователя по айди
      parameters:
        - $ref: '#/components/parameters/User_id'
      responses:
        '200':
          description: Пользователь успешно найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetUsersByID'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '500':
          $ref: '#/components/responses/Error'
  /users/{id}:
    put:
      operationId: updateUser
      tags:
        - Обновление пользователя
      summary: Обновление данных пользователя
      parameters:
        - $ref: '#/components/parameters/User_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
      responses:
        '200':
          description: Пользователь успешно обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "account updated successfully"
        '400':
          $ref: '#/components/responses/MessageResponse'
        '500':
          $ref: '#/components/responses/MessageResponse'
components:
  parameters:
    User_id:
      name: id
      in: path
      description: Айди
      required: true
      schema:
        type: integer
        format: int64
        example: 1
    UserName:
      name: name
      in: query
      description: Имя
      required: false
      schema:
        type: string
        example: "Ivan"
    UserPhoneNumber:
      name: phone_number
      in: query
      description: Номер телефона
      required: false
      schema:
        type: string
        example: "+79001234567"
    UserMail:
      name: mail
      in: query
      description: Почта
      required: false
      schema:
        type: string
        example: "user@example.com"
    Limit:
      name: limit
      in: query
      description: Ограничение количества пользователей
      required: false
      schema:
        type: integer
        format: int32
        example: 10
  schemas:
    User:
      type: object
      required: [ name, phone_number, mail ]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: "Ivan"
        phone_number:
          type: string
          example: "+79001234567"
        mail:
          type: string
          example: "ivan@example.com"
    Account:
      type: object
      required: [ id, id_user, balance, currency ]
      properties:
        id:
          type: integer
          format: int64
          example: 1
        id_user:
          type: integer
          format: int64
          example: 1
        balance:
          type: integer
          format: int64
          example: 100000
        currency:
          type: string
          example: "RUB"
    GetUsersResponse:
      type: object
      required: [ users ]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    GetAccountsResponse:
      type: object
      required: [ accounts ]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    GetUsersByID:
      type: object
      required: [ user, accounts ]
      properties:
        user:
          $ref: '#/components/schemas/User'
        accounts:
          $ref: '#/components/schemas/GetAccountsResponse'
    Error:
            type: object
            required: [ status, code, message ]
            properties:
              status:
                type: integer
          description: HTTP статус код
                example: 400
              code:
                type: integer
                format: int32
          description: Код ошибки приложения
                example: 0
              message:
                type: string
          description: Сообщение об ошибке
                example: "error message"
    MessageResponse:
      allOf:
        - $ref: '#/components/schemas/Error'
  responses:
    Error:
      description: Сообщение об ошибке
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MessageResponse:
      description: Сообщение об ошибке
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'